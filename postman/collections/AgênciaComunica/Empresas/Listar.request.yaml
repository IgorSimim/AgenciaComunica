$kind: http-request
description: ""
url: "{{baseURL}}/api/empresa"
method: GET
headers:
  Cookie: next-auth.session-token={{sessionToken}}
order: 1000
scripts:
  - type: afterResponse
    code: |-
      // Salva o cod da primeira empresa retornada para uso nas rotas de detalhe/atualizar/excluir
      const json = pm.response.json();
      if (Array.isArray(json) && json.length > 0) {
          pm.collectionVariables.set("empresaCod", json[0].cod);
          console.log("empresaCod salvo:", json[0].cod);
      }
    language: text/javascript
