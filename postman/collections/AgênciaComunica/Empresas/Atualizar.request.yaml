$kind: http-request
name: Atualizar
url: '{{baseURL}}/api/empresa/{{empresaCod}}'
method: PUT
headers:
  Cookie: 'next-auth.session-token={{sessionToken}}'
  Content-Type: application/json
order: 2000
body:
  type: json
  content: |-
    {
      "nome": "{{empresa_nome}}",
      "email": "{{empresa_email}}",
      "setor": "{{empresa_setor}}",
      "logotipoUrl": "{{empresa_logotipoUrl}}",
      "logotipoPublicId": "{{empresa_logotipoPublicId}}",
      "ativa": true
    }
