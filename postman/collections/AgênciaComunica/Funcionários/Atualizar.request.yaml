$kind: http-request
url: "{{baseURL}}/api/funcionario/{{funcionarioId}}"
method: PUT
headers:
  Cookie: next-auth.session-token={{sessionToken}}
  Content-Type: application/json
order: 3000
body:
  type: json
  content: |-
    {
      "nome": "{{func_nome}}",
      "email": "{{func_email}}",
      "telefone": "{{func_telefone}}",
      "sobre": "{{func_sobre}}",
      "fotoUrl": "{{func_fotoUrl}}",
      "fotoPublicId": "{{func_fotoPublicId}}",
      "cargo": "{{func_cargo}}"
    }
