$kind: http-request
url: "{{baseURL}}/api/servico/{{servicoId}}"
method: PUT
headers:
  Cookie: next-auth.session-token={{sessionToken}}
  Content-Type: application/json
order: 3000
body:
  type: json
  content: |-
    {
      "nome": "{{servico_nome}}",
      "descricao": "{{servico_descricao}}",
      "preco": {{servico_preco}},
      "simboloUrl": "{{servico_simboloUrl}}",
      "simboloPublicId": "{{servico_simboloPublicId}}"
    }
